[defaults]
inventory = inventory/hosts.ini
roles_path = roles
collections_path = ~/.ansible/collections
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent

# Secrets are Ansible-Vault encrypted (see group_vars/airflow/vault.yml.example).
# Point this at a local, un-committed file containing the vault password,
# or omit it and pass --ask-vault-pass / --vault-password-file on the CLI.
# vault_password_file = .vault_pass.txt

# Speed + safety for larger fleets.
forks = 10
pipelining = True

# Fact caching avoids re-gathering facts across repeated playbook/tag runs.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_tmp/facts_cache
fact_caching_timeout = 86400

# Make task output easier to audit.
stdout_callback = ansible.builtin.default
display_skipped_hosts = False

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
# Reuse SSH connections across tasks (big speedup on multi-task plays).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
