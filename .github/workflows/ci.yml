name: lint

on:
  push:
  pull_request:

jobs:
  ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible and linters
        run: |
          pip install "ansible-core>=2.16" ansible-lint yamllint
          ansible-galaxy collection install -r requirements.yml
      - name: Yamllint
        run: yamllint .
      - name: Syntax check
        run: |
          cp inventory/hosts.ini.example inventory/hosts.ini
          ansible-playbook playbooks/install-airflow.yml --syntax-check
          ansible-playbook playbooks/render-check.yml --syntax-check
      - name: Ansible lint
        run: ansible-lint
        