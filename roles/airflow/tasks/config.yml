---
- name: Airflow | Ensure airflow directories structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ airflow_user }}"
    group: "{{ airflow_group }}"
    mode: "0750"
  loop:
    - "{{ airflow_logs_folder }}"
    - "{{ airflow_child_process_log_folder }}"
    - "{{ airflow_dags_folder }}"
    - "{{ airflow_plugins_folder }}"

- name: Airflow | Copy gunicorn logrotate config
  ansible.builtin.template:
    src: gunicorn-logrotate.j2
    dest: /etc/logrotate.d/airflow
    mode: "0644"
    owner: root
    group: root
  tags: airflow-gunicorn-logrotate

- name: Airflow | Copy webserver_config.py file (contains LDAP/OAuth secrets - restricted)
  ansible.builtin.template:
    src: webserver_config.j2
    dest: "{{ airflow_app_home }}/webserver_config.py"
    owner: "{{ airflow_user }}"
    group: "{{ airflow_group }}"
    mode: "0640"
  register: airflow_webserver_config
  notify: "{{ airflow_restart_notify_handlers }}"
  tags: airflow-webserver-config-py

- name: Airflow | Copy basic airflow config file
  ansible.builtin.template:
    src: "{{ airflow_config_template_path }}"
    dest: "{{ airflow_conf_path }}/airflow.cfg"
    owner: "{{ airflow_user }}"
    group: "{{ airflow_group }}"
    mode: "0640"
  register: airflow_config
  notify: "{{ airflow_restart_notify_handlers }}"
  tags: airflow-cfg

- name: Airflow | Validate rendered airflow.cfg can be parsed by Airflow itself
  ansible.builtin.command:
    argv:
      - "{{ airflow_executable }}"
      - config
      - list
  become: true
  become_user: "{{ airflow_user }}"
  changed_when: false
  environment:
    AIRFLOW_HOME: "{{ airflow_app_home }}"
    AIRFLOW_CONFIG: "{{ airflow_conf_path }}/airflow.cfg"
  tags:
    - airflow-cfg
    - validate

- name: Airflow | Database schema migration (run once, from the primary node only)
  ansible.builtin.command:
    argv:
      - "{{ airflow_executable }}"
      - db
      - migrate
  become: true
  become_user: "{{ airflow_user }}"
  environment:
    AIRFLOW_HOME: "{{ airflow_app_home }}"
    AIRFLOW_CONFIG: "{{ airflow_conf_path }}/airflow.cfg"
  register: airflow_db_migrate
  changed_when: "'Migrations done' in airflow_db_migrate.stdout or 'Upgrades done' in airflow_db_migrate.stdout"
  when: airflow_run_db_migrate | default(true)
  notify: "{{ airflow_restart_notify_handlers }}"
  tags: airflow-db-init

- name: Airflow | Copy extra airflow config files (provided by playbooks)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ airflow_conf_path }}/{{ item | basename }}"
    owner: "{{ airflow_user }}"
    group: "{{ airflow_group }}"
    mode: "0640"
  loop: "{{ query('ansible.builtin.fileglob', airflow_extra_conf_path + '/*') }}"
  notify: "{{ airflow_restart_notify_handlers }}"
  tags: airflow-extra-config

- name: Airflow | Copy extra airflow config templates (provided by playbooks)
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ airflow_conf_path }}/{{ item | basename }}"
    owner: "{{ airflow_user }}"
    group: "{{ airflow_group }}"
    mode: "0640"
  loop: "{{ query('ansible.builtin.fileglob', airflow_extra_conf_template_path + '/*') }}"
  notify: "{{ airflow_restart_notify_handlers }}"
  tags: airflow-extra-config

# --- Variables & connections: templated + imported via the Airflow CLI's
# bulk import commands instead of looping shell commands per item. This
# avoids secrets ever appearing in `ps`/shell history/Ansible logs, and
# makes the step genuinely idempotent (file content only changes - and the
# import only re-runs - when the actual variables/connections changed).
- name: Airflow | Render variables file (sensitive - not logged)
  ansible.builtin.template:
    src: airflow-variables.json.j2
    dest: "{{ airflow_conf_path }}/.variables.json"
    owner: "{{ airflow_user }}"
    group: "{{ airflow_group }}"
    mode: "0600"
  register: airflow_variables_file
  no_log: true
  when: airflow_admin_variables | length > 0
  tags: airflow-extra-vars-file

- name: Airflow | Import variables
  ansible.builtin.command:
    argv:
      - "{{ airflow_executable }}"
      - variables
      - import
      - "{{ airflow_conf_path }}/.variables.json"
  become: true
  become_user: "{{ airflow_user }}"
  no_log: true
  changed_when: airflow_variables_file.changed  # noqa: no-handler
  when: airflow_admin_variables | length > 0
  tags: airflow-extra-vars-file

- name: Airflow | Render connections file (sensitive - not logged)
  ansible.builtin.template:
    src: airflow-connections.json.j2
    dest: "{{ airflow_conf_path }}/.connections.json"
    owner: "{{ airflow_user }}"
    group: "{{ airflow_group }}"
    mode: "0600"
  register: airflow_connections_file
  no_log: true
  when: airflow_admin_connections | length > 0
  tags: airflow-extra-conn-file

- name: Airflow | Import connections
  ansible.builtin.command:
    argv:
      - "{{ airflow_executable }}"
      - connections
      - import
      - "{{ airflow_conf_path }}/.connections.json"
  become: true
  become_user: "{{ airflow_user }}"
  no_log: true
  changed_when: airflow_connections_file.changed  # noqa: no-handler
  when: airflow_admin_connections | length > 0
  tags: airflow-extra-conn-file

- name: Airflow | Remove sensitive import files after use
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ airflow_conf_path }}/.variables.json"
    - "{{ airflow_conf_path }}/.connections.json"
  tags:
    - airflow-extra-vars-file
    - airflow-extra-conn-file

- name: Airflow | Deploy DAG files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../dags/"
    dest: "{{ airflow_dags_folder }}/"
    owner: "{{ airflow_user }}"
    group: "{{ airflow_group }}"
    mode: "0640"
    directory_mode: "0750"
  tags:
    - airflow-dags

- name: Airflow | Synchronize DAG directory
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../dags/"
    dest: "{{ airflow_dags_folder }}/"
    archive: true
    delete: true
    rsync_path: "sudo rsync"
    rsync_opts:
      - "--chown={{ airflow_user }}:{{ airflow_group }}"
      - "--exclude=__pycache__/"
  tags:
    - airflow-dags