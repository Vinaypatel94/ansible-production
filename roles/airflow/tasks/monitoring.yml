---
# Installs Prometheus statsd_exporter so Airflow's native StatsD metrics
# ([metrics] statsd_on = True, already set in airflow-cfg.yml) can be
# scraped by Prometheus at http://127.0.0.1:{{ airflow_statsd_exporter_web_port }}/metrics
# Set airflow_monitoring_enabled: false to skip entirely (e.g. if you
# already run a fleet-wide statsd_exporter/Datadog agent elsewhere).

- name: Monitoring | Ensure statsd-exporter system user exists
  ansible.builtin.user:
    name: "{{ airflow_statsd_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  when: airflow_monitoring_enabled

- name: Monitoring | Download statsd_exporter release
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/statsd_exporter/releases/download/v{{ airflow_statsd_exporter_version }}/statsd_exporter-{{ airflow_statsd_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/statsd_exporter-{{ airflow_statsd_exporter_version }}.linux-amd64.tar.gz"
    checksum: "{{ airflow_statsd_exporter_checksum }}"
    mode: "0644"
  when: airflow_monitoring_enabled
  register: airflow_statsd_download
  retries: 3
  delay: 5
  until: airflow_statsd_download is succeeded

- name: Monitoring | Extract statsd_exporter binary
  ansible.builtin.unarchive:
    src: "/tmp/statsd_exporter-{{ airflow_statsd_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/statsd_exporter-{{ airflow_statsd_exporter_version }}.linux-amd64/statsd_exporter"
  when: airflow_monitoring_enabled

- name: Monitoring | Install statsd_exporter binary
  ansible.builtin.copy:
    src: "/tmp/statsd_exporter-{{ airflow_statsd_exporter_version }}.linux-amd64/statsd_exporter"
    dest: /usr/local/bin/statsd_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: airflow_monitoring_enabled
  notify: Restart statsd-exporter

- name: Monitoring | Ensure mapping config directory exists
  ansible.builtin.file:
    path: /etc/statsd-exporter
    state: directory
    owner: root
    group: "{{ airflow_statsd_exporter_user }}"
    mode: "0750"
  when: airflow_monitoring_enabled

- name: Monitoring | Deploy metric mapping config
  ansible.builtin.template:
    src: statsd-exporter-mapping.yml.j2
    dest: /etc/statsd-exporter/mapping.yml
    owner: root
    group: "{{ airflow_statsd_exporter_user }}"
    mode: "0640"
  when: airflow_monitoring_enabled
  notify: Restart statsd-exporter

- name: Monitoring | Deploy statsd_exporter systemd unit
  ansible.builtin.template:
    src: statsd-exporter.service.j2
    dest: /lib/systemd/system/statsd-exporter.service
    owner: root
    group: root
    mode: "0644"
  when: airflow_monitoring_enabled
  notify: Restart statsd-exporter

- name: Monitoring | Enable and start statsd_exporter
  ansible.builtin.systemd_service:
    name: statsd-exporter
    enabled: true
    state: started
    daemon_reload: true
  when: airflow_monitoring_enabled

- name: Monitoring | Verify metrics endpoint responds
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ airflow_statsd_exporter_web_port }}/metrics"
    status_code: 200
    timeout: 5
  when: airflow_monitoring_enabled
  register: airflow_statsd_metrics_check
  retries: 6
  delay: 3
  until: airflow_statsd_metrics_check.status is defined and airflow_statsd_metrics_check.status == 200
  tags:
    - validate
