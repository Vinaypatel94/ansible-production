---
  - name: Airflow | Check existing users
    ansible.builtin.command:
      argv:
        - "{{ airflow_executable }}"
        - users
        - list
        - --output
        - json
    become: true
    become_user: "{{ airflow_user }}"
    register: airflow_check_users
    changed_when: false
    no_log: true
    environment:
      AIRFLOW_HOME: "{{ airflow_app_home }}"
      AIRFLOW_CONFIG: "{{ airflow_conf_path }}/airflow.cfg"
    when: (airflow_admin_users + airflow_regular_users) | length > 0
  
  - name: Airflow | Fail fast if admin users are declared without credentials
    ansible.builtin.assert:
      that:
        - item.username is defined
        - item.username | length > 0
        - item.password is defined
        - item.password | length >= 12
        - item.email is defined
        - item.email | length > 0
      fail_msg: >-
        airflow_admin_users entries must define username, email, and a
        password of at least 12 characters stored in Ansible Vault.
      quiet: true
    loop: "{{ airflow_admin_users }}"
    no_log: true
  
  - name: Airflow | Create admin users
    ansible.builtin.command:
      argv:
        - "{{ airflow_executable }}"
        - users
        - create
        - --username
        - "{{ item.username }}"
        - --password
        - "{{ item.password }}"
        - --firstname
        - "{{ item.firstname | default('Admin') }}"
        - --lastname
        - "{{ item.lastname | default('User') }}"
        - --role
        - "{{ item.role | default('Admin') }}"
        - --email
        - "{{ item.email }}"
    become: true
    become_user: "{{ airflow_user }}"
    no_log: true
    environment:
      AIRFLOW_HOME: "{{ airflow_app_home }}"
      AIRFLOW_CONFIG: "{{ airflow_conf_path }}/airflow.cfg"
    loop: "{{ airflow_admin_users }}"
    when: item.username not in airflow_check_users.stdout
    register: airflow_created_admin_users
    changed_when: true
  
  - name: Airflow | Create regular users
    ansible.builtin.command:
      argv:
        - "{{ airflow_executable }}"
        - users
        - create
        - --username
        - "{{ item.username }}"
        - --password
        - "{{ item.password }}"
        - --firstname
        - "{{ item.firstname | default('') }}"
        - --lastname
        - "{{ item.lastname | default('') }}"
        - --role
        - "{{ item.role | default('Public') }}"
        - --email
        - "{{ item.email }}"
    become: true
    become_user: "{{ airflow_user }}"
    no_log: true
    environment:
      AIRFLOW_HOME: "{{ airflow_app_home }}"
      AIRFLOW_CONFIG: "{{ airflow_conf_path }}/airflow.cfg"
    loop: "{{ airflow_regular_users }}"
    when:
      - airflow_regular_users | length > 0
      - item.username not in airflow_check_users.stdout
    changed_when: true