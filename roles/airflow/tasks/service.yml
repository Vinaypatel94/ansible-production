---
- name: Airflow | Copy environment file
  ansible.builtin.template:
    src: airflow-environment-file.j2
    dest: "{{ airflow_environment_file_folder }}/airflow"
    mode: "0640"
    owner: root
    group: "{{ airflow_group }}"
  notify: "{{ airflow_restart_notify_handlers }}"

- name: Airflow | Copy systemd unit files
  ansible.builtin.template:
    src: "{{ item.value.path }}"
    dest: "/lib/systemd/system/{{ item.value.service_name }}.service"
    mode: "0644"
    owner: root
    group: root
  loop: "{{ airflow_services | dict2items }}"
  notify: "Restart {{ item.value.service_name }}"

- name: Airflow | Configure services (enable/disable + start/stop per group_vars)
  ansible.builtin.systemd_service:
    name: "{{ item.value.service_name }}"
    state: "{{ item.value.state }}"
    enabled: "{{ item.value.enabled }}"
    daemon_reload: true
  loop: "{{ airflow_services | dict2items }}"
  register: airflow_service_state
  changed_when: airflow_service_state.changed | default(false)

# --- Health checks -----------------------------------------------------
# Run with `--tags validate` after a deploy (or automatically at the end
# of the role) to confirm the services that are supposed to be running
# actually came up healthy, instead of silently reporting "ok" on a dead
# process.
- name: Airflow | Wait for webserver health endpoint
  ansible.builtin.uri:
    url: "{{ airflow_health_url }}"
    status_code: 200
    timeout: 10
  register: airflow_health
  retries: 12
  delay: 5
  until: airflow_health.status is defined and airflow_health.status == 200
  when: airflow_services.airflow_webserver.enabled | bool
  tags:
    - validate

- name: Airflow | Verify scheduler/triggerer/worker systemd units are active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ item.value.service_name }}"
  loop: "{{ airflow_services | dict2items }}"
  when: item.value.enabled | bool
  register: airflow_unit_active
  changed_when: false
  failed_when: airflow_unit_active.stdout is defined and airflow_unit_active.stdout != 'active'
  tags:
    - validate
