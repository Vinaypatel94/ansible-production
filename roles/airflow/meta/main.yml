---

galaxy_info:
  role_name: airflow_role
  namespace: idealista
  company: Idealista S.A.U.
  author: Idealista S.A.U.
  description: Role to automate the installation of Apache Airflow
  min_ansible_version: 2.16.0.0
  license: Apache 2.0
  platforms:
    - name: Ubuntu
      versions:
        - jammy    # 22.04 LTS
        - noble    # 24.04 LTS (recommended - matches Python 3.12/PostgreSQL 16 defaults)
    - name: Debian
      versions:
        - bookworm
        - bullseye
  galaxy_tags:
    - airflow
    - apache
    - workflow
    - celery
dependencies:
  - role: redis
    when: redis_manage | default(true)
