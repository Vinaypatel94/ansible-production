---
- name: Converge
  hosts: airflow_group
  pre_tasks:
    - name: Wait for the sibling PostgreSQL test container to accept connections
      ansible.builtin.wait_for:
        host: postgres
        port: 5432
        timeout: 60

    - name: Wait for the sibling Redis test container to accept connections
      ansible.builtin.wait_for:
        host: redis
        port: 6379
        timeout: 60

  roles:
    - role: airflow

  environment:
    AIRFLOW_HOME: "{{ airflow_app_home }}"
    AIRFLOW_CONFIG: "{{ airflow_conf_path }}/airflow.cfg"
