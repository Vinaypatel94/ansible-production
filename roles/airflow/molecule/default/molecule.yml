---
dependency:
  name: galaxy

driver:
  name: docker

lint: |
  yamllint .
  ansible-lint .

platforms:
  # Real PostgreSQL + Redis containers (not systemd, not part of
  # airflow_group) so the role is tested against the same CeleryExecutor
  # + PostgreSQL topology used in production, instead of a SequentialExecutor
  # + sqlite stand-in.
  - name: postgres
    image: docker.io/library/postgres:16
    privileged: false
    env:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: molecule-test-only-not-real
      POSTGRES_DB: airflow

  - name: redis
    image: docker.io/library/redis:7.2-alpine
    privileged: false
    command: redis-server --requirepass molecule-test-only-not-real

  - name: airflow
    groups:
      - airflow_group
    image: ${MOLECULE_DISTRO:-debian:bookworm-slim}
    privileged: false
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    volumes:
      - '/sys/fs/cgroup:/sys/fs/cgroup:rw'
      - '/var/run/docker.sock:/var/run/docker.sock'
    command: '/lib/systemd/systemd'
    cgroupns_mode: host
    stop_signal: 'RTMIN+3'
    exposed_ports:
      - 8088/tcp
      - 8080/tcp
      - 8081/tcp
      - 5000/tcp
      - 5555/tcp
    published_ports:
      - 0.0.0.0:8088:8088/tcp
      - 0.0.0.0:8080:8080/tcp
      - 0.0.0.0:8081:8081/tcp
      - 0.0.0.0:5000:5000/tcp
      - 0.0.0.0:5555:5555/tcp
    links:
      - postgres
      - redis

provisioner:
  name: ansible

scenario:
  name: default

verifier:
  name: ansible
