---
# Whether this role should install/manage Redis at all. Set to false when
# pointing airflow_celery_broker_url at an external broker (e.g. AWS
# ElastiCache) so the role becomes a no-op.
redis_manage: true

redis_package: redis-server
redis_service_name: redis-server
redis_user: redis
redis_group: redis

# Bind address: default to localhost only. Override to the private
# interface IP via host_vars if the broker must be reachable from other
# nodes (e.g. separate worker hosts). Never bind 0.0.0.0 in production.
redis_bind_address: "127.0.0.1"
redis_port: 6379

# Required: set via Ansible Vault (vault_redis_password). Empty/undefined
# fails validation deliberately rather than running an unauthenticated
# broker.
redis_password: ""

redis_maxmemory: "512mb"
redis_maxmemory_policy: "allkeys-lru"

# Persistence: Celery broker data is transient queue state, so AOF/RDB are
# mainly useful to avoid losing in-flight task messages across restarts.
redis_appendonly: "yes"
redis_save_enabled: true

redis_config_path: /etc/redis/redis.conf
redis_log_path: /var/log/redis/redis-server.log

# supervised systemd integration
redis_supervised: "systemd"
